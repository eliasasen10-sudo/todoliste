<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todoliste</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --surface-2: #f9f9fb;
      --border: #e5e5ea;
      --text: #1d1d1f;
      --text-2: #6e6e73;
      --text-3: #aeaeb2;
      --accent: #0071e3;
      --danger: #ff3b30;
      --radius: 14px;
      --radius-sm: 8px;
      --shadow: 0 2px 12px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.06);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    }

    /* Person colors */
    .color-marc     { --pc: #0071e3; }
    .color-julian   { --pc: #30d158; }
    .color-elias    { --pc: #bf5af2; }
    .color-nikola   { --pc: #ff9f0a; }
    .color-dietmar  { --pc: #ff453a; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── AUTH ─────────────────────────────────────── */
    #auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-card {
      background: var(--surface);
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-lg);
      animation: fadeUp 0.35s ease;
    }

    .auth-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 6px;
    }

    .auth-sub {
      color: var(--text-2);
      font-size: 0.875rem;
      margin-bottom: 28px;
    }

    /* Person grid */
    .person-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 4px;
    }

    .person-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px 8px;
      border-radius: var(--radius);
      border: 2px solid var(--border);
      background: var(--surface-2);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      font-family: var(--font);
    }

    .person-btn:hover {
      border-color: var(--pc);
      background: var(--surface);
    }

    .person-btn:active { transform: scale(0.96); }

    .person-btn.selected {
      border-color: var(--pc);
      background: var(--surface);
    }

    .person-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--pc);
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .person-name {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text);
    }

    /* Code step */
    #step-code { display: none; }

    .selected-person-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .selected-person-row .person-avatar {
      width: 42px;
      height: 42px;
      font-size: 1rem;
    }

    .selected-person-row strong {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-family: var(--font);
      font-size: 0.875rem;
      cursor: pointer;
      padding: 0;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .auth-input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 1.1rem;
      background: var(--surface-2);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
      text-align: center;
      letter-spacing: 0.25em;
    }

    .auth-input:focus { border-color: var(--accent); }
    .auth-input.error { border-color: var(--danger); animation: shake 0.3s ease; }

    .auth-error {
      color: var(--danger);
      font-size: 0.8rem;
      margin-top: 8px;
      min-height: 1.2em;
    }

    /* ── APP ──────────────────────────────────────── */
    #app-screen {
      display: none;
      max-width: 680px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--pc, var(--accent));
      color: white;
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    /* ── TABS ─────────────────────────────────────── */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--border);
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 8px;
      font-family: var(--font);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-2);
      background: transparent;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tab-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    /* ── BUTTONS ──────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: 980px;
      border: none;
      font-family: var(--font);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: #0077ed; }

    .btn-ghost {
      background: transparent;
      color: var(--text-2);
      border: 1.5px solid var(--border);
    }

    .btn-ghost:hover { background: var(--surface); color: var(--text); }

    .btn-danger-ghost {
      background: transparent;
      color: var(--danger);
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      border: none;
      font-family: var(--font);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      opacity: 0.55;
      transition: opacity 0.15s, background 0.15s;
    }

    .btn-danger-ghost:hover { opacity: 1; background: rgba(255,59,48,0.07); }

    /* ── FILTER ───────────────────────────────────── */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 6px 14px;
      border-radius: 980px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-family: var(--font);
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-2);
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn:hover { color: var(--text); border-color: #c7c7cc; }
    .filter-btn.active { background: var(--text); color: white; border-color: var(--text); }

    /* ── TODO LIST ────────────────────────────────── */
    #todo-list { display: flex; flex-direction: column; gap: 10px; }

    .todo-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 15px 16px;
      box-shadow: var(--shadow);
      border: 1.5px solid var(--border);
      animation: fadeUp 0.22s ease;
      transition: box-shadow 0.2s;
    }

    .todo-card:hover {
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .todo-card.assigned-to-me {
      border-left: 3px solid var(--accent);
    }

    .todo-card.familie-card {
      border-left: 3px solid #30d158;
    }

    .todo-card.status-erledigt { opacity: 0.55; }
    .todo-card.status-erledigt .todo-title { text-decoration: line-through; color: var(--text-2); }

    .todo-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }

    .todo-title {
      font-size: 0.9375rem;
      font-weight: 500;
      line-height: 1.35;
      flex: 1;
    }

    .todo-note {
      font-size: 0.8125rem;
      color: var(--text-2);
      line-height: 1.45;
      margin-bottom: 10px;
    }

    /* Assignment badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 980px;
      margin-bottom: 8px;
    }

    .badge-assigned-to-me {
      background: rgba(0,113,227,0.1);
      color: #0055b3;
    }

    .badge-assigned-by-me {
      background: rgba(191,90,242,0.1);
      color: #8a2be2;
    }

    .badge-familie {
      background: rgba(48,209,88,0.12);
      color: #1a8c3a;
    }

    .badge-owner {
      background: rgba(110,110,115,0.1);
      color: var(--text-2);
    }

    .todo-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-select {
      appearance: none;
      -webkit-appearance: none;
      border: none;
      font-family: var(--font);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 980px;
      cursor: pointer;
      outline: none;
      transition: filter 0.15s;
    }

    .status-select:hover { filter: brightness(0.94); }
    .status-select[data-status="Offen"] { background: rgba(255,159,10,0.12); color: #b57900; }
    .status-select[data-status="In Bearbeitung"] { background: rgba(0,113,227,0.10); color: #0055b3; }
    .status-select[data-status="Erledigt"] { background: rgba(48,209,88,0.12); color: #1a8c3a; }

    .todo-date { font-size: 0.72rem; color: var(--text-3); }

    .todo-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ── MODAL ────────────────────────────────────── */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .modal-backdrop.open { display: flex; animation: backdropIn 0.2s ease; }

    .modal {
      background: var(--surface);
      border-radius: 20px;
      padding: 28px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-lg);
      animation: modalIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .modal-header h2 { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.02em; }

    .modal-close {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: none;
      background: var(--bg);
      color: var(--text-2);
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .modal-close:hover { background: var(--border); }

    .field { margin-bottom: 12px; }

    .field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .field input, .field textarea, .field select {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 0.9375rem;
      background: var(--surface-2);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
      resize: none;
    }

    .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
    .field textarea { min-height: 64px; line-height: 1.5; }
    .field input::placeholder, .field textarea::placeholder { color: var(--text-3); }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    /* ── COMMENTS ────────────────────────────────── */
    .comments-section {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .comment-item {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 0.8rem;
    }

    .comment-author {
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }

    .comment-text {
      color: var(--text-2);
    }

    .comment-input-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .comment-input {
      flex: 1;
      padding: 7px 10px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 0.8125rem;
      background: var(--surface-2);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    .comment-input:focus { border-color: var(--accent); }

    .comment-submit {
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      border: none;
      background: var(--accent);
      color: white;
      font-family: var(--font);
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .comment-submit:hover { background: #0077ed; }

    .word-count {
      font-size: 0.7rem;
      color: var(--text-3);
      text-align: right;
      margin-top: 2px;
    }

    .word-count.over { color: var(--danger); }

    /* ── EMPTY STATE ──────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 56px 20px;
      color: var(--text-3);
    }

    .empty-state svg { width: 44px; height: 44px; margin: 0 auto 14px; opacity: 0.25; }
    .empty-state p { font-size: 0.875rem; }

    /* ── ANIMATIONS ───────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes backdropIn {
      from { opacity: 0; } to { opacity: 1; }
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.92) translateY(8px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%  { transform: translateX(-6px); }
      75%  { transform: translateX(6px); }
    }

    @media (max-width: 480px) {
      #app-screen { padding: 20px 14px 60px; }
      .auth-card { padding: 32px 20px; }
      .person-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    }
  </style>
</head>
<body>

<!-- ── AUTH SCREEN ──────────────────────────────── -->
<div id="auth-screen">
  <div class="auth-card">

    <!-- Step 1: Person selection -->
    <div id="step-persons">
      <div class="auth-title">Todoliste</div>
      <div class="auth-sub">Wer bist du?</div>
      <div class="person-grid" id="person-grid"></div>
    </div>

    <!-- Step 2: Code input -->
    <div id="step-code">
      <button class="back-btn" onclick="backToPersons()">
        ← Zurück
      </button>
      <div class="selected-person-row" id="selected-person-row"></div>
      <input
        type="password"
        id="code-input"
        class="auth-input"
        placeholder="Code"
        maxlength="20"
        autocomplete="off"
        onkeydown="if(event.key==='Enter')login()"
      >
      <div class="auth-error" id="auth-error"></div>
      <button class="btn btn-primary" style="width:100%;margin-top:16px;justify-content:center;" onclick="login()">
        Entsperren
      </button>
    </div>
  </div>
</div>

<!-- ── APP SCREEN ───────────────────────────────── -->
<div id="app-screen">
  <header>
    <div class="header-left">
      <div class="header-avatar" id="header-avatar"></div>
      <h1 id="header-name"></h1>
    </div>
    <button class="btn btn-ghost" onclick="logout()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Abmelden
    </button>
  </header>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" id="tab-meine" onclick="switchTab('meine')">Meine Todos</button>
    <button class="tab-btn" id="tab-familie" onclick="switchTab('familie')">Familie</button>
  </div>

  <!-- Buttons -->
  <div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;">
    <button class="btn btn-primary" onclick="openModal(false)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Neue Aufgabe
    </button>
    <button class="btn btn-ghost" onclick="openModal(true)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      Zuweisen
    </button>
  </div>

  <!-- Filter (only in Meine tab) -->
  <div class="filter-bar" id="filter-bar">
    <button class="filter-btn active" onclick="setFilter('alle', this)">Alle</button>
    <button class="filter-btn" onclick="setFilter('meine', this)">Nur meine</button>
    <button class="filter-btn" onclick="setFilter('zugewiesen', this)">Zugewiesen</button>
  </div>

  <div id="todo-list"></div>
</div>

<!-- ── MODAL ─────────────────────────────────────── -->
<div class="modal-backdrop" id="modal-backdrop" onclick="onBackdropClick(event)">
  <div class="modal">
    <div class="modal-header">
      <h2>Neue Aufgabe</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="field">
      <label>Titel</label>
      <input type="text" id="new-title" placeholder="Was soll erledigt werden?" maxlength="200" onkeydown="if(event.key==='Enter')addTodo()">
    </div>
    <div class="field">
      <label>Notiz (optional)</label>
      <textarea id="new-note" placeholder="Zusätzliche Infos…" maxlength="500" rows="2"></textarea>
    </div>
    <div class="field" id="assign-field">
      <label>Zuweisen an</label>
      <select id="new-assign" onchange="onAssignChange()">
        <option value="Familie">Familie</option>
      </select>
    </div>
    <div id="visible-field" style="display:none;margin-top:4px;">
      <label style="display:flex;align-items:center;gap:8px;font-size:0.875rem;color:var(--text-2);cursor:pointer;font-weight:400;text-transform:none;letter-spacing:normal;">
        <input type="checkbox" id="visible-to-owner" style="width:16px;height:16px;cursor:pointer;">
        Bei mir anzeigen (zum Nachverfolgen)
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn btn-primary" onclick="addTodo()">Hinzufügen</button>
    </div>
  </div>
</div>

<script>
  // ── State ─────────────────────────────────────────
  const PERSON_COLORS = {
    Marc: '#0071e3', Julian: '#30d158', Elias: '#bf5af2',
    Nikola: '#ff9f0a', Dietmar: '#ff453a'
  };

  let session = { user: null }; // in-memory, cleared on refresh
  let todos = [];
  let members = [];
  let currentFilter = 'alle';
  let currentTab = 'meine';
  let selectedPerson = null;

  // ── Init ──────────────────────────────────────────
  async function init() {
    const res = await fetch('/api/members');
    members = await res.json();
    renderPersonGrid();
  }

  function renderPersonGrid() {
    const grid = document.getElementById('person-grid');
    grid.innerHTML = members.map(m => `
      <button class="person-btn color-${m.toLowerCase()}" onclick="selectPerson('${m}')">
        <div class="person-avatar" style="background:${PERSON_COLORS[m]}">${m[0]}</div>
        <span class="person-name">${m}</span>
      </button>
    `).join('');
  }

  function selectPerson(name) {
    selectedPerson = name;
    document.getElementById('step-persons').style.display = 'none';
    document.getElementById('step-code').style.display = 'block';
    document.getElementById('code-input').value = '';
    document.getElementById('auth-error').textContent = '';

    document.getElementById('selected-person-row').innerHTML = `
      <div class="person-avatar" style="background:${PERSON_COLORS[name]};width:42px;height:42px;font-size:1rem;font-weight:700;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white">${name[0]}</div>
      <strong>${name}</strong>
    `;
    setTimeout(() => document.getElementById('code-input').focus(), 50);
  }

  function backToPersons() {
    selectedPerson = null;
    document.getElementById('step-code').style.display = 'none';
    document.getElementById('step-persons').style.display = 'block';
  }

  // ── Auth ──────────────────────────────────────────
  async function login() {
    const input = document.getElementById('code-input');
    const err = document.getElementById('auth-error');
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user: selectedPerson, code: input.value })
      });
      if (res.ok) {
        const data = await res.json();
        session.user = data.user;
        showApp();
      } else {
        input.classList.add('error');
        err.textContent = 'Falscher Code.';
        setTimeout(() => input.classList.remove('error'), 400);
      }
    } catch {
      err.textContent = 'Verbindungsfehler.';
    }
  }

  function logout() {
    session.user = null;
    todos = [];
    document.getElementById('app-screen').style.display = 'none';
    document.getElementById('auth-screen').style.display = 'flex';
    backToPersons();
  }

  function showApp() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'block';

    // Set header
    const color = PERSON_COLORS[session.user] || '#0071e3';
    const avatar = document.getElementById('header-avatar');
    avatar.textContent = session.user[0];
    avatar.style.background = color;
    document.getElementById('header-name').textContent = session.user;

    // Populate assign dropdown with other members
    const sel = document.getElementById('new-assign');
    sel.innerHTML = '<option value="Familie">Familie</option>';
    members.filter(m => m !== session.user).forEach(m => {
      const opt = document.createElement('option');
      opt.value = m;
      opt.textContent = m;
      sel.appendChild(opt);
    });

    switchTab('meine');
    loadTodos();
  }

  // ── API ───────────────────────────────────────────
  function headers() {
    return { 'Content-Type': 'application/json', 'X-User': session.user };
  }

  async function loadTodos() {
    try {
      const res = await fetch('/api/todos', { headers: headers() });
      todos = await res.json();
      renderTodos();
    } catch { renderError(); }
  }

  async function addTodo() {
    const titleEl  = document.getElementById('new-title');
    const noteEl   = document.getElementById('new-note');
    const assignEl = document.getElementById('new-assign');
    const title = titleEl.value.trim();
    const note  = noteEl.value.trim();
    if (!title && !note) {
      titleEl.style.borderColor = 'var(--danger)';
      noteEl.style.borderColor  = 'var(--danger)';
      setTimeout(() => { titleEl.style.borderColor = ''; noteEl.style.borderColor = ''; }, 1200);
      titleEl.focus();
      return;
    }
    try {
      const res = await fetch('/api/todos', {
        method: 'POST',
        headers: headers(),
        body: JSON.stringify({
          title,
          note: noteEl.value,
          assignedTo: document.getElementById('assign-field').style.display === 'none' ? '' : assignEl.value,
          visibleToOwner: document.getElementById('visible-to-owner').checked
        })
      });
      if (!res.ok) { const e = await res.json(); alert('Fehler: ' + (e.error || res.status)); return; }
      const todo = await res.json();
      const assignedTo = document.getElementById('assign-field').style.display === 'none' ? '' : assignEl.value;
      todos.unshift(todo);
      closeModal();
      if (assignedTo === 'Familie') switchTab('familie');
      renderTodos();
    } catch (e) { alert('Fehler beim Speichern: ' + e.message); }
  }

  async function updateStatus(id, status) {
    try {
      const res = await fetch(`/api/todos/${id}`, {
        method: 'PATCH',
        headers: headers(),
        body: JSON.stringify({ status })
      });
      const updated = await res.json();
      const idx = todos.findIndex(t => t._id === id);
      if (idx !== -1) todos[idx] = updated;
      renderTodos();
    } catch { alert('Fehler.'); }
  }

  function updateWordCount(id) {
    const input = document.getElementById(`ci-${id}`);
    const wc = document.getElementById(`wc-${id}`);
    if (!input || !wc) return;
    const words = input.value.trim() ? input.value.trim().split(/\s+/).length : 0;
    wc.textContent = `${words} / 10 Wörter`;
    wc.classList.toggle('over', words > 10);
  }

  async function addComment(id) {
    const input = document.getElementById(`ci-${id}`);
    const text = input.value.trim();
    if (!text) return;
    const words = text.split(/\s+/).length;
    if (words > 10) { input.style.borderColor = 'var(--danger)'; setTimeout(() => input.style.borderColor = '', 1200); return; }
    try {
      const res = await fetch(`/api/todos/${id}/comment`, {
        method: 'POST',
        headers: headers(),
        body: JSON.stringify({ text })
      });
      if (!res.ok) { alert('Fehler beim Kommentar.'); return; }
      const updated = await res.json();
      const idx = todos.findIndex(t => t._id === id);
      if (idx !== -1) todos[idx] = updated;
      renderTodos();
    } catch { alert('Fehler.'); }
  }

  async function handoff(id) {
    try {
      await fetch(`/api/todos/${id}`, {
        method: 'PATCH',
        headers: headers(),
        body: JSON.stringify({ visibleToOwner: false })
      });
      todos = todos.filter(t => t._id !== id);
      renderTodos();
    } catch { alert('Fehler.'); }
  }

  async function deleteTodo(id) {
    try {
      await fetch(`/api/todos/${id}`, { method: 'DELETE', headers: headers() });
      todos = todos.filter(t => t._id !== id);
      renderTodos();
    } catch { alert('Fehler.'); }
  }

  // ── View ──────────────────────────────────────────
  function switchTab(tab) {
    currentTab = tab;
    currentFilter = 'alle';
    document.getElementById('tab-meine').classList.toggle('active', tab === 'meine');
    document.getElementById('tab-familie').classList.toggle('active', tab === 'familie');
    document.getElementById('filter-bar').style.display = tab === 'meine' ? 'flex' : 'none';
    // Reset filter buttons
    document.querySelectorAll('.filter-btn').forEach((b, i) => b.classList.toggle('active', i === 0));
    renderTodos();
  }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTodos();
  }

  function getFilteredTodos() {
    if (currentTab === 'familie') {
      return todos.filter(t => t.assignedTo === 'Familie');
    }
    // Meine tab
    const me = session.user;
    let list = todos.filter(t => t.assignedTo !== 'Familie' && (t.owner === me || t.assignedTo === me));
    if (currentFilter === 'meine')      list = list.filter(t => t.owner === me && !t.assignedTo);
    if (currentFilter === 'zugewiesen') list = list.filter(t => t.assignedTo === me);
    return list;
  }

  function renderTodos() {
    const list = document.getElementById('todo-list');
    const items = getFilteredTodos();
    if (!items.length) {
      list.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
          <p>Keine Aufgaben hier.</p>
        </div>`;
      return;
    }

    const me = session.user;
    list.innerHTML = items.map(t => {
      const isAssignedToMe  = t.assignedTo === me;
      const isAssignedByMe  = t.owner === me && t.assignedTo && t.assignedTo !== 'Familie';
      const isFamilie       = t.assignedTo === 'Familie';
      const statusKey       = t.status.replace(' ', '').toLowerCase();

      let cardClass = `todo-card status-${statusKey}`;
      if (isAssignedToMe) cardClass += ' assigned-to-me';
      if (isFamilie)      cardClass += ' familie-card';

      let badge = '';
      if (isFamilie) {
        badge = `<div class="badge badge-familie">🏠 Familie</div>`;
        if (currentTab === 'familie') {
          badge += `<div class="badge badge-owner">von ${escHtml(t.owner)}</div>`;
        }
      } else if (isAssignedToMe) {
        badge = `<div class="badge badge-assigned-to-me">← Zugewiesen von ${escHtml(t.owner)}</div>`;
      } else if (isAssignedByMe) {
        badge = `<div class="badge badge-assigned-by-me">→ Zugewiesen an ${escHtml(t.assignedTo)}</div>`;
      }

      const canDelete = t.owner === me || t.assignedTo === me || isFamilie;
      const showHandoff = isAssignedByMe && t.visibleToOwner;

      return `
      <div class="${cardClass}">
        <div class="todo-top">
          <div class="todo-title">${escHtml(t.title || t.note)}</div>
          <div class="todo-actions">
            ${showHandoff ? `
            <button class="btn-ghost" style="padding:4px 10px;font-size:0.75rem;border-radius:6px;" onclick="handoff('${t._id}')" title="Übergeben — aus meiner Liste entfernen">
              ✓ Übergeben
            </button>` : ''}
            ${canDelete ? `
            <button class="btn-danger-ghost" onclick="deleteTodo('${t._id}')" title="Löschen">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                <path d="M10 11v6M14 11v6"/>
              </svg>
            </button>` : ''}
          </div>
        </div>
        ${t.note && t.title ? `<div class="todo-note">${escHtml(t.note)}</div>` : ''}
        ${badge}
        <div class="todo-meta">
          <select
            class="status-select"
            data-status="${escHtml(t.status)}"
            onchange="updateStatus('${t._id}', this.value); this.dataset.status=this.value;"
          >
            <option ${t.status==='Offen'          ?'selected':''}>Offen</option>
            <option ${t.status==='In Bearbeitung' ?'selected':''}>In Bearbeitung</option>
            <option ${t.status==='Erledigt'       ?'selected':''}>Erledigt</option>
          </select>
          <span class="todo-date">${formatDate(t.createdAt)}</span>
        </div>
        ${isFamilie ? `
        <div class="comments-section">
          ${(t.comments||[]).map(c => `
            <div class="comment-item">
              <span class="comment-author">${escHtml(c.author)}:</span>
              <span class="comment-text">${escHtml(c.text)}</span>
            </div>
          `).join('')}
          <div class="comment-input-row">
            <input
              class="comment-input"
              id="ci-${t._id}"
              placeholder="Kommentar…"
              maxlength="120"
              oninput="updateWordCount('${t._id}')"
              onkeydown="if(event.key==='Enter')addComment('${t._id}')"
            >
            <button class="comment-submit" onclick="addComment('${t._id}')">Senden</button>
          </div>
          <div class="word-count" id="wc-${t._id}">0 / 10 Wörter</div>
        </div>` : ''}
      </div>`;
    }).join('');
  }

  function renderError() {
    document.getElementById('todo-list').innerHTML =
      '<div class="empty-state"><p>Verbindungsfehler.</p></div>';
  }

  // ── Modal ─────────────────────────────────────────
  function onAssignChange() {
    const val = document.getElementById('new-assign').value;
    // Show "Bei mir anzeigen" only when assigning to a person (not Familie)
    document.getElementById('visible-field').style.display =
      (val && val !== 'Familie') ? 'block' : 'none';
  }

  function openModal(withAssign) {
    const assignField = document.getElementById('assign-field');
    const assignEl = document.getElementById('new-assign');
    const title = document.querySelector('.modal-header h2');

    if (withAssign) {
      assignField.style.display = 'block';
      title.textContent = 'Zuweisen';
      assignEl.selectedIndex = 0;
    } else {
      assignField.style.display = 'none';
      title.textContent = 'Neue Aufgabe';
      assignEl.selectedIndex = 0;
    }
    document.getElementById('visible-field').style.display = 'none';
    document.getElementById('visible-to-owner').checked = false;

    document.getElementById('modal-backdrop').classList.add('open');
    setTimeout(() => document.getElementById('new-title').focus(), 50);
  }

  function closeModal() {
    document.getElementById('modal-backdrop').classList.remove('open');
    document.getElementById('new-title').value = '';
    document.getElementById('new-note').value  = '';
    document.getElementById('new-assign').selectedIndex = 0;
  }

  function onBackdropClick(e) {
    if (e.target === document.getElementById('modal-backdrop')) closeModal();
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ── Helpers ───────────────────────────────────────
  function formatDate(iso) {
    return new Date(iso).toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit', year:'2-digit' });
  }

  function escHtml(str) {
    return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  init();
</script>
</body>
</html>
